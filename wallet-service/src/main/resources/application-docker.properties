# Docker profile overrides - use container hostnames instead of localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/wallet_db}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces
