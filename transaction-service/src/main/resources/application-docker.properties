# Docker profile overrides - use container hostnames instead of localhost
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/transaction_db}
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
wallet.service.url=${WALLET_SERVICE_URL:http://wallet-service:8091}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8093}
ai.service.url=${AI_SERVICE_URL:http://ai-service:8095}
management.otlp.tracing.endpoint=http://tempo:4318/v1/traces

