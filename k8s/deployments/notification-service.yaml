apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: distributed-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: distributed-wallet/notification-service:latest
        ports:
        - containerPort: 8094
        envFrom:
        - configMapRef:
            name: wallet-config
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: wallet-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wallet-secrets
              key: DB_PASSWORD

        # optional for now; keep blank if you don't have real values yet
        - name: TWILIO_ACCOUNT_SID
          value: ""
        - name: TWILIO_AUTH_TOKEN
          value: ""
        - name: TWILIO_PHONE_NUMBER
          value: ""
        - name: MAIL_USERNAME
          value: ""
        - name: MAIL_PASSWORD
          value: ""

        resources:
          limits:
            cpu: "300m"
            memory: "384Mi"
          requests:
            cpu: "150m"
            memory: "192Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8094
          initialDelaySeconds: 25
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8094
          initialDelaySeconds: 40
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: distributed-wallet
spec:
  selector:
    app: notification-service
  ports:
  - protocol: TCP
    port: 8094
    targetPort: 8094
  type: ClusterIP    