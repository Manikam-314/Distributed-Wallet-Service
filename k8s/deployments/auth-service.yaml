apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: distributed-wallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: distributed-wallet/auth-service:latest
        ports:
        - containerPort: 8093
        envFrom:
        - configMapRef:
            name: wallet-config
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: wallet-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wallet-secrets
              key: DB_PASSWORD
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8093
          initialDelaySeconds: 25
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8093
          initialDelaySeconds: 40
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: distributed-wallet
spec:
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 8093
    targetPort: 8093
  type: ClusterIP