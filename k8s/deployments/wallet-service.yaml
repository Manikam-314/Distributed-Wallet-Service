apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-service
  namespace: distributed-wallet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wallet-service
  template:
    metadata:
      labels:
        app: wallet-service
    spec:
      containers:
      - name: wallet-service
        image: distributed-wallet/wallet-service:latest
        ports:
        - containerPort: 8091
        envFrom:
        - configMapRef:
            name: wallet-config
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: wallet-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wallet-secrets
              key: DB_PASSWORD
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8091
          initialDelaySeconds: 25
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8091
          initialDelaySeconds: 40
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-service
  namespace: distributed-wallet
spec:
  selector:
    app: wallet-service
  ports:
  - protocol: TCP
    port: 8091
    targetPort: 8091
  type: ClusterIP