apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: distributed-wallet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
      - name: ai-service
        image: distributed-wallet/ai-service:latest
        ports:
        - containerPort: 8095
        envFrom:
        - configMapRef:
            name: wallet-config
        - secretRef:
            name: wallet-secrets
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
        readinessProbe:
          tcpSocket:
            port: 8095
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8095
          initialDelaySeconds: 40
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: distributed-wallet
spec:
  selector:
    app: ai-service
  ports:
  - protocol: TCP
    port: 8095
    targetPort: 8095
  type: ClusterIP