server:
  port: 8090

spring:
  cloud:
    gateway:
      routes:
        - id: wallet-service
          uri: http://wallet-service:8091
          predicates:
            - Path=/api/wallet/**
          filters:
            - AuthenticationFilter
            - StripPrefix=1

        - id: transaction-service
          uri: http://transaction-service:8092
          predicates:
            - Path=/api/transactions/**,/api/requests/**
          filters:
            - AuthenticationFilter
            - StripPrefix=1

        - id: auth-service
          uri: http://auth-service:8093
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: agent-service
          uri: http://agent-service:9100
          predicates:
            - Path=/api/agent/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET:verysecretkeyverysecretkeyverysecretkeyverysecretkey}

# ===== Phase 7: Observability =====
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: api-gateway
      service: api-gateway