# Docker profile overrides for API Gateway
# Overrides localhost URIs with Docker container hostnames

server:
  port: 8090

spring:
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: "*"
      routes:
        - id: wallet-service
          uri: ${WALLET_SERVICE_URL:http://localhost:8091}
          predicates:
            - Path=/api/wallet/**
          filters:
            - AuthenticationFilter
            - StripPrefix=1

        - id: transaction-service
          uri: ${TRANSACTION_SERVICE_URL:http://localhost:8092}
          predicates:
            - Path=/api/transactions/**, /api/requests/**
          filters:
            - AuthenticationFilter
            - StripPrefix=1

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8093}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: agent-service
          uri: ${AGENT_SERVICE_URL:http://localhost:9100}
          predicates:
            - Path=/api/agent/**
          filters:
            - AuthenticationFilter

